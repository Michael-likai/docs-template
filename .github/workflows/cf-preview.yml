name: Cloudflare Pages Preview

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write
  issues: write

concurrency:
  group: cf-preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  preview:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
    steps:
      - name: Check Cloudflare configuration
        id: gate
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Set CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID to enable PR previews."
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout
        if: steps.gate.outputs.enabled == 'true'
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Setup pnpm
        if: steps.gate.outputs.enabled == 'true'
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node
        if: steps.gate.outputs.enabled == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        if: steps.gate.outputs.enabled == 'true'
        run: pnpm install --frozen-lockfile

      - name: Build preview
        if: steps.gate.outputs.enabled == 'true'
        run: pnpm build
        env:
          # Preview is served at the domain root; canonical stays on production.
          SITE_URL: https://michael-likai.github.io/docs-template
          BASE_PATH: /
          CLEAN_URLS: "false"
          PREVIEW: "1"

      - name: Deploy preview
        id: deploy
        if: steps.gate.outputs.enabled == 'true'
        env:
          CF_PAGES_PROJECT: ${{ vars.CF_PAGES_PROJECT }}
        run: |
          set -euo pipefail
          PROJECT="${CF_PAGES_PROJECT:-docs-template}"
          BRANCH="pr-${PR_NUMBER}"
          if ! npx -y wrangler@3 pages project list | grep -q "$PROJECT"; then
            npx -y wrangler@3 pages project create "$PROJECT" --production-branch main
          fi
          npx -y wrangler@3 pages deploy docs/.vitepress/dist --project-name "$PROJECT" --branch "$BRANCH" --commit-dirty=true
          SUBDOMAIN=$(curl -fsS -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/pages/projects/${PROJECT}" \
            | node -e 'let s = ""; process.stdin.on("data", (d) => (s += d)).on("end", () => { try { process.stdout.write(JSON.parse(s).result?.subdomain || "") } catch { process.stdout.write("") } })')
          echo "url=https://${BRANCH}.${SUBDOMAIN:-${PROJECT}.pages.dev}" >> "$GITHUB_OUTPUT"

      - name: Comment preview URL
        if: steps.gate.outputs.enabled == 'true'
        uses: actions/github-script@v7
        env:
          PREVIEW_URL: ${{ steps.deploy.outputs.url }}
          COMMIT_SHA: ${{ github.event.pull_request.head.sha }}
        with:
          script: |
            const marker = '<!-- cf-pages-preview -->'
            const body = [
              marker,
              '### Cloudflare Pages 预览',
              '',
              process.env.PREVIEW_URL,
              '',
              `commit \`${process.env.COMMIT_SHA.slice(0, 7)}\` · 每次推送自动更新。预览站带 noindex。`
            ].join('\n')
            const { owner, repo } = context.repo
            const issue_number = context.payload.pull_request.number
            const { data: comments } = await github.rest.issues.listComments({ owner, repo, issue_number })
            const existing = comments.find((comment) => comment.body?.includes(marker))
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body })
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body })
            }
